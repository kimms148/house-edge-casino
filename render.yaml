databases:
  - name: house-edge-db
    plan: free
    databaseName: house_edge
    user: house_edge

services:
  - type: web
    name: house-edge-casino
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: house-edge-db
          property: connectionString
